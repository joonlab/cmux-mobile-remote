<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="shot" content="w=470,h=457,scale=3">
<link rel="stylesheet" href="https://mockup-kit.invalid/kit.css">
<script src="https://mockup-kit.invalid/kit.js"></script>
<link rel="stylesheet" href="scene.css">
</head><body>
<style>
  .sheet { margin-top:auto; background:var(--panel); border-top:1px solid var(--border); border-radius:20px 20px 0 0; padding:8px 16px 14px; display:flex; flex-direction:column; gap:8px; }
  .handle { width:36px; height:4px; border-radius:2px; background:var(--border); align-self:center; }
  .code { font-family:var(--mono); font-size:14px; line-height:20px; background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:8px 11px; }
  .opt { font-size:15px; }
</style>
<div class="phone dark app-cmux"><div class="screen">
  <div class="status-bar" data-time="10:12"></div>
  <div class="app-bar">
    <i data-icon="arrow-left" style="font-size:22px"></i>
    <span class="title" style="font-size:19px">사진 정리 스크립트</span>
    <span class="spacer"></span>
    <span class="tag warn" style="font-size:12.5px; line-height:16px; margin-right:10px">홈맥 · 권한 대기</span>
  </div>
  <div style="flex:1; min-height:0; display:flex; flex-direction:column; padding:10px 16px 0; gap:8px">
    <div class="msg me" style="font-size:15px">중복 사진 찾아서 폴더로 옮기는 스크립트 돌려 봐</div>
  </div>
  <div class="sheet">
    <div class="handle"></div>
    <div class="row" style="gap:8px; font-size:17px; font-weight:700"><i data-icon="lock" style="color:var(--warn)"></i>Bash 를 실행할까요?</div>
    <div class="code">python3 organize.py --dry-run</div>
    <div class="opt on"><span class="k">1</span>Yes</div>
    <div class="opt"><span class="k">2</span>Yes, and don't ask again</div>
    <div class="opt"><span class="k">3</span>No</div>
    <div class="btn btn-primary btn-block" style="height:42px; font-size:16px"><i data-icon="check"></i>1 번으로 답하기</div>
  </div>
</div></div>
</body></html>
