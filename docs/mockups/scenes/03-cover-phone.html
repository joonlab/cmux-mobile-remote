<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="shot" content="w=250,h=660,scale=3">
<link rel="stylesheet" href="https://mockup-kit.invalid/kit.css">
<script src="https://mockup-kit.invalid/kit.js"></script>
<link rel="stylesheet" href="scene.css">
</head><body>
<style>
  .content { padding:10px 10px 12px !important; gap:8px !important; }
  .big { border-radius:14px; padding:12px; }
  .big .n { font-size:34px; line-height:38px; font-weight:800; color:var(--warn-text); }
.tab { padding:11px 11px; }
  .tab .t { font-size:17px; line-height:23px; }
  .tab .s { font-size:14px; line-height:19px; }
  .tab .ico { font-size:20px; }
  .sec { font-size:14px; margin-top:6px; }
</style>
<div class="phone dark app-cmux"><div class="screen">
  <div class="status-bar" data-time="11:30" style="padding:0 14px 0 16px"></div>
  <div class="app-bar" style="padding-left:12px">
    <img class="mark" data-app="cmux" alt="">
    <span class="title" style="font-size:18px">관제실</span>
    <span class="spacer"></span>
    <span class="icon-btn"><i data-icon="plus"></i></span>
  </div>
  <div class="content">
    <div class="card warn big">
      <div class="card-row" style="gap:8px"><i data-icon="lock" style="font-size:20px; color:var(--warn)"></i><span class="card-title" style="font-size:16px">나를 기다림</span><span class="n" style="margin-left:auto">2</span></div>
      <div class="meta" style="font-size:13px">노트북 질문 1 · 홈맥 권한 1</div>
    </div>
    <div class="sec"><i data-icon="laptop"></i>노트북</div>
    <div class="tab lock"><i class="ico" data-icon="lock"></i><div class="grow"><div class="t ellipsis">회의 메모</div><div class="s ellipsis">질문 대기</div></div></div>
    <div class="tab run"><i class="ico" data-icon="refresh"></i><div class="grow"><div class="t ellipsis">레시피 사이트</div><div class="s ellipsis">작업 중 · 1분</div></div></div>
    <div class="sec"><i data-icon="monitor"></i>홈맥</div>
    <div class="tab lock"><i class="ico" data-icon="lock"></i><div class="grow"><div class="t ellipsis">사진 정리</div><div class="s ellipsis">권한 대기 · Bash</div></div></div>
    <div class="tab run"><i class="ico" data-icon="sparkle"></i><div class="grow"><div class="t ellipsis">블로그 초안</div><div class="s ellipsis">뒤에서 에이전트 2</div></div></div>
  </div>
  <div class="nav-handle"></div>
</div></div>
</body></html>
