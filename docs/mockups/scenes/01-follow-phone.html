<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<!-- 폴드8 펼친 화면(가로 1.35:1) — 배경 A_open_landscape -->
<meta name="shot" content="w=480,h=355,scale=3.75">
<link rel="stylesheet" href="https://mockup-kit.invalid/kit.css">
<script src="https://mockup-kit.invalid/kit.js"></script>
<link rel="stylesheet" href="scene.css">
</head><body>
<style>
  .status-bar { height:22px; }
  .app-bar { height:38px; }
  .tab { padding:8px 9px; }
  .tab .t { font-size:15px; }
  .tab .s { font-size:12px; }
  .opt { font-size:14px; padding:7px 10px; }
</style>
<div class="phone dark app-cmux"><div class="screen">
  <div class="status-bar" data-time="9:41"></div>
  <div class="app-bar">
    <img class="mark" data-app="cmux" alt="">
    <span class="title" style="font-size:17px">관제실</span>
    <span class="spacer"></span>
    <span class="status" style="font-size:12px"><span class="dot ok"></span>맥 화면 따라가기</span>
    <span class="switch on" style="margin:0 8px 0 6px"></span>
  </div>
  <div class="two-pane" style="grid-template-columns: 170px 1fr">
    <div class="pane" style="padding:8px 7px 8px 9px; gap:6px">
      <div class="sec"><i data-icon="lock"></i>나를 기다림<span class="n">2</span></div>
      <div class="col-list" style="gap:6px">
        <div class="tab lock sel"><i class="ico" data-icon="lock"></i><div class="grow"><div class="t ellipsis">장보기 앱</div><div class="s ellipsis">노트북 · 질문</div></div></div>
        <div class="tab lock"><i class="ico" data-icon="lock"></i><div class="grow"><div class="t ellipsis">사진 정리</div><div class="s ellipsis">홈맥 · 권한</div></div></div>
      </div>
      <div class="sec"><i data-icon="zap"></i>진행 중<span class="n">1</span></div>
      <div class="tab run"><i class="ico" data-icon="refresh"></i><div class="grow"><div class="t ellipsis">회의 메모</div><div class="s ellipsis">노트북 · 2분</div></div></div>
    </div>
    <div class="pane" style="padding:8px 9px 8px 8px; gap:6px">
      <div class="row" style="gap:6px"><span class="tag warn">질문 대기</span><span class="meta" style="font-size:12px">노트북</span></div>
      <div class="askcard" style="padding:10px; gap:6px">
        <div class="card-title" style="font-size:15px; line-height:20px">목록을 어디에 저장할까요?</div>
        <div class="opt on"><span class="k">1</span>기기 안 데이터베이스</div>
        <div class="opt"><span class="k">2</span>JSON 파일 그대로</div>
        <div class="btn btn-primary btn-block" style="height:36px; font-size:14px"><i data-icon="send"></i>이 답 보내기</div>
      </div>
    </div>
  </div>
</div></div>
</body></html>
